global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "incident-demo-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:3000", "host.docker.internal:3000"]
        labels:
          service: "order-service"
          env: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
